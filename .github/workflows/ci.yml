name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libchafa-dev libglib2.0-dev

      - name: Go vet and tests (rustmeow bridge)
        working-directory: whatsrust/lib
        run: |
          go vet ./...
          go test ./...

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test -- --test-threads=1

  nix-build-and-devshell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build Go bridge with Nix
        run: nix build --no-update-lock-file --print-build-logs --no-link .#whatsrust-libgo

      - name: Build wp-tui with Nix
        run: |
          nix build --no-update-lock-file --print-build-logs .#default
          test -x result/bin/wp-tui
          ./result/bin/wp-tui --version

      - name: Run wp-tui from dev shell
        run: nix develop --no-update-lock-file --command wp-tui --version
