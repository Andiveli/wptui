name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  platform_suite:
    name: Platform suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libwayland-dev libchafa-dev libglib2.0-dev libasound2-dev
          else
            brew install chafa
          fi

      - name: Go vet and tests (rustmeow bridge)
        working-directory: whatsrust/lib
        run: |
          go vet ./...
          go test ./...

      - name: Test release archive installer
        run: bash tests/install_archive.sh

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked -- --test-threads=1

  build-and-test:
    # Preserve the required branch-protection check while gating both platforms.
    needs: platform_suite
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require Linux and macOS suites
        run: test "${{ needs.platform_suite.result }}" = success

  nix-build-and-devshell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build Go bridge with Nix
        run: nix build --no-update-lock-file --print-build-logs --no-link .#whatsrust-libgo

      - name: Build wp-tui with Nix
        run: |
          nix build --no-update-lock-file --print-build-logs .#default
          test -x result/bin/wp-tui
          ./result/bin/wp-tui --version

      - name: Run wp-tui from dev shell
        run: nix develop --no-update-lock-file --command wp-tui --version
